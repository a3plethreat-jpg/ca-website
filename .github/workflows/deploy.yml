name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy
        # Pasted secrets sometimes carry spaces, line breaks or quotes; strip them, then check the
        # token with Cloudflare before deploying so a bad token fails with a clear message.
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CF_TOKEN" | tr -d ' \t\r\n"'"'"'')"
          status=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -r '.result.status // "invalid"')
          if [ "$status" != "active" ]; then
            status=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq -r '.result.status // "invalid"')
          fi
          echo "Cloudflare token status: $status (length ${#CLOUDFLARE_API_TOKEN})"
          [ "$status" = "active" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not a valid, active Cloudflare API token"; exit 1; }
          npm run deploy:vinext
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 49828bb26f248a5e3d803f3422dea6c0 # not secret; the repo secret had stray characters
